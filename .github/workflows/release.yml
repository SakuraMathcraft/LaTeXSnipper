name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag matching VERSION (vX.Y.Z or vX.Y.Z-LTS)"
        type: string
        required: true
      publish_assets:
        description: "Publish installers and application update resources"
        type: boolean
        default: false
      validate_gpu:
        description: "Run CUDA hardware checks on configured self-hosted runners"
        type: boolean
        default: false

permissions:
  actions: read
  contents: write

concurrency:
  group: desktop-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  prepare-release:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          case "$RELEASE_TAG" in
            "v$version"|"v$version-LTS") ;;
            *) echo 'Release tag must match VERSION' >&2; exit 1 ;;
          esac
          publish='${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish_assets }}'
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          if [ "$publish" = true ]; then
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release edit "$RELEASE_TAG" --draft
            else
              gh release create "$RELEASE_TAG" --draft --target '${{ github.sha }}' --generate-notes
            fi
          fi

  models:
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with: {lfs: true}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install requests
      - name: Assemble common, verified models
        run: python scripts/build_desktop_release.py models --tag "$RELEASE_TAG"
      - name: Upload model component
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" build/common-models/*.zip --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: common-models
          path: build/common-models/**
          if-no-files-found: error

  desktop:
    needs: [prepare-release, models]
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: windows, runner: windows-2025, requirements: requirements.txt}
          - {system: linux, runner: ubuntu-22.04, requirements: requirements-linux.txt}
          - {system: macos, runner: macos-15, requirements: requirements-macos.txt}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: true}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python scripts/desktop_distribution.py sources
      - run: python -m pip install -r ${{ matrix.requirements }} -r requirements-build.txt
      - name: Install Linux build and system libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/desktop-system-libraries
      - name: Install Windows packaging tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-7.1.0-x64.exe'
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'inno-setup-7'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $installer
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike '*Pyrsys*') { throw 'Inno Setup publisher verification failed.' }
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$compilerRoot") -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          $compilerRoot >> $env:GITHUB_PATH
      - uses: actions/download-artifact@v7
        with: {name: common-models, path: build/common-models}
      - name: Calculate component build inputs
        id: inputs
        run: python scripts/build_desktop_release.py inputs
      - uses: actions/cache@v5
        with:
          path: |
            build/desktop/application/stamp.json
            build/desktop/application/*.zip
          key: desktop-application-zip-${{ matrix.system }}-${{ steps.inputs.outputs.application }}
      - uses: actions/cache@v5
        with:
          path: |
            build/desktop/inference-cpu/stamp.json
            build/desktop/inference-cpu/*.zip
            build/desktop/inference-gpu/stamp.json
            build/desktop/inference-gpu/*.zip
          key: desktop-inference-zip-${{ matrix.system }}-${{ steps.inputs.outputs.inference }}
      - name: Assemble native components
        run: python scripts/build_desktop_release.py assemble
      - name: Package components and offline installers
        run: python scripts/build_desktop_release.py package --tag "${{ env.RELEASE_TAG }}"
      - name: Check optional Windows signing
        id: signpath-config
        if: runner.os == 'Windows'
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        shell: python
        run: |
          import os
          names = ('SIGNPATH_API_TOKEN', 'SIGNPATH_ORGANIZATION_ID', 'SIGNPATH_PROJECT_SLUG',
                   'SIGNPATH_SIGNING_POLICY_SLUG', 'SIGNPATH_ARTIFACT_CONFIGURATION_SLUG')
          enabled = all(os.environ.get(name, '').strip() for name in names)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'enabled={str(enabled).lower()}\n')
          print('SignPath configured.' if enabled else 'SignPath unavailable; keeping unsigned installers.')
      - uses: actions/upload-artifact@v7
        id: unsigned-installers
        if: runner.os == 'Windows' && steps.signpath-config.outputs.enabled == 'true'
        with:
          name: unsigned-desktop-installers
          path: dist/desktop/LaTeXSnipper_*.exe
          if-no-files-found: error
          compression-level: 0
      - name: Sign Windows first-install carriers
        id: sign-installers
        if: runner.os == 'Windows' && steps.signpath-config.outputs.enabled == 'true'
        continue-on-error: true
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installers.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-installers
      - name: Compute final Windows installer identities
        if: runner.os == 'Windows' && steps.sign-installers.outcome == 'success'
        run: python scripts/build_desktop_release.py finalize-windows --signed signed-installers
      - name: Upload desktop installers and update components
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/build_desktop_release.py upload --tag "${{ env.RELEASE_TAG }}"
      - uses: actions/upload-artifact@v7
        if: needs.prepare-release.outputs.publish == 'true'
        with:
          name: release-metadata-${{ matrix.system }}
          path: dist/desktop/distribution-*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: needs.prepare-release.outputs.publish != 'true' || inputs.validate_gpu
        with:
          name: desktop-${{ matrix.system }}
          path: dist/desktop/**
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: desktop-validation-${{ matrix.system }}
          if-no-files-found: ignore
          path: |
            build/desktop/*validation.json

  gpu:
    if: github.event_name == 'workflow_dispatch' && inputs.validate_gpu
    needs: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - {system: windows, runner: '["self-hosted", "Windows", "X64", "cuda"]'}
          - {system: linux, runner: '["self-hosted", "Linux", "X64", "cuda"]'}
    runs-on: ${{ fromJSON(matrix.runner) }}
    steps:
      - uses: actions/checkout@v6
        with: {lfs: true}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: python -m pip install requests Pillow
      - uses: actions/download-artifact@v7
        with: {name: 'desktop-${{ matrix.system }}', path: build/gpu-release}
      - name: Real CUDA recognition and loaded-library audit
        run: python scripts/validate_desktop_release.py --directory build/gpu-release --gpu --output build/gpu-acceptance.json
      - uses: actions/upload-artifact@v7
        with:
          name: gpu-validation-${{ matrix.system }}
          path: build/gpu-acceptance.json
          if-no-files-found: error

  publish-release-assets:
    needs: [prepare-release, models, desktop, gpu, build-office-plugin-installer, build-user-manual]
    if: >-
      always() && needs.prepare-release.outputs.publish == 'true' &&
      needs.models.result == 'success' && needs.desktop.result == 'success' &&
      (needs.gpu.result == 'success' || needs.gpu.result == 'skipped') &&
      needs.build-office-plugin-installer.result == 'success' && needs.build-user-manual.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - uses: actions/download-artifact@v7
        with: {pattern: 'release-metadata-*', merge-multiple: true, path: release-metadata}
      - name: Publish update catalog and complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_artifacts.py --tag "$RELEASE_TAG" --version "$(cat VERSION)" --directory release-metadata

  build-office-plugin-installer:
    needs: prepare-release
    name: Validate Office Plugin Installer
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Validate committed Office installer
        id: installer
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          product_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_source="${RELEASE_TAG_INPUT:-v${product_version}-LTS}"
          else
            release_source="${{ github.ref_name }}"
          fi
          if [[ "$release_source" =~ v?([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release source does not contain a semantic version: $release_source" >&2
            exit 1
          fi
          if [[ "$version" != "$product_version" ]]; then
            echo "Release version $version does not match VERSION $product_version." >&2
            exit 1
          fi
          installer="office_plugin/release/LaTeXSnipperOffice_${version}_amd64.exe"
          checksum="${installer}.sha256"
          test -f "$installer"
          test -f "$checksum"
          expected="$(awk '{print tolower($1)}' "$checksum")"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "Office installer checksum mismatch." >&2
            exit 1
          fi
          echo "Validated $installer ($actual)"
          echo "path=$installer" >> "$GITHUB_OUTPUT"

      - name: Publish Office plugin installer
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" '${{ steps.installer.outputs.path }}' --clobber

      - name: Upload Office plugin installer artifact
        if: needs.prepare-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: office-plugin-installer
          path: ${{ steps.installer.outputs.path }}
          if-no-files-found: error
          retention-days: 30

  build-user-manual:
    needs: prepare-release
    name: Build User Manual
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Typst
        shell: pwsh
        run: |
          $typstVersion = "0.14.2"
          $typstZip = "typst-x86_64-pc-windows-msvc.zip"
          $typstUrl = "https://github.com/typst/typst/releases/download/v$typstVersion/$typstZip"
          Invoke-WebRequest -Uri $typstUrl -OutFile $env:TEMP\$typstZip
          Expand-Archive -Path $env:TEMP\$typstZip -DestinationPath $env:TEMP\typst -Force
          $typst = Get-ChildItem -Path $env:TEMP\typst -Recurse -Filter "typst.exe" | Select-Object -First 1
          if (-not $typst) { throw "Typst binary not found after extraction." }
          "TYPST=$($typst.FullName)" >> $env:GITHUB_ENV

      - name: Compile user manual
        shell: pwsh
        run: |
          & $env:TYPST compile --root $env:GITHUB_WORKSPACE user_manual\user_manual.typ user_manual\LaTeXSnipper_User_Manual.pdf

      - name: Publish user manual
        if: needs.prepare-release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:RELEASE_TAG" user_manual/LaTeXSnipper_User_Manual.pdf --clobber

      - name: Upload user manual artifact
        if: needs.prepare-release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: user-manual
          path: user_manual/LaTeXSnipper_User_Manual.pdf
          if-no-files-found: error
          retention-days: 30
