name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-check:
    name: Compile Check
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Byte-compile source tree
        run: python -m compileall -q src mathcraft_ocr

      - name: Validate Python comment language
        shell: pwsh
        run: |
          @'
          import ast
          import io
          import pathlib
          import tokenize

          roots = [pathlib.Path("src"), pathlib.Path("mathcraft_ocr"), pathlib.Path("scripts")]
          violations = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  if "deps" in path.parts:
                      continue
                  text = path.read_text(encoding="utf-8", errors="replace")
                  for token in tokenize.generate_tokens(io.StringIO(text).readline):
                      if token.type == tokenize.COMMENT and any(ord(ch) > 127 for ch in token.string):
                          violations.append(f"{path}:{token.start[0]} non-ASCII comment")
                  try:
                      tree = ast.parse(text)
                  except SyntaxError:
                      continue
                  for node in ast.walk(tree):
                      if not isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                          continue
                      if not node.body:
                          continue
                      first = node.body[0]
                      if (
                          isinstance(first, ast.Expr)
                          and isinstance(first.value, ast.Constant)
                          and isinstance(first.value.value, str)
                          and any(ord(ch) > 127 for ch in first.value.value)
                      ):
                          violations.append(f"{path}:{first.lineno} non-ASCII docstring")
          if violations:
              raise SystemExit("\n".join(violations))
          '@ | python -

      - name: Build Office plugin managed projects
        shell: pwsh
        run: dotnet build office_plugin\LaTeXSnipper.OfficePlugin.slnx -c Release

      - name: Run Office Bridge tests
        run: python -m pytest test/test_office_bridge.py -q

  linux-hotkey-packaging:
    name: Linux Hotkey Packaging
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run Linux hotkey packaging tests
        run: python -m pytest test/test_linux_hotkey_packaging.py -q
