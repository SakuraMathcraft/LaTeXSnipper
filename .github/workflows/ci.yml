name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      platform_validation:
        description: Optional native desktop integration checks
        type: choice
        default: none
        options:
          - none
          - windows
          - linux
          - macos
          - all

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-check:
    if: github.event_name != 'workflow_dispatch' || inputs.platform_validation == 'none'
    name: Compile Check
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Byte-compile source tree
        run: python -m compileall -q src mathcraft_ocr

      - name: Validate UTF-8 text boundaries
        run: python test/test_source_encoding.py

      - name: Validate desktop distribution inputs
        run: python scripts/desktop_distribution.py sources

      - name: Validate translation catalog
        run: |
          python scripts/update_translations.py --check
          python scripts/check_ui_translations.py

      - name: Validate Python comment language
        shell: pwsh
        run: |
          @'
          import ast
          import io
          import pathlib
          import tokenize

          roots = [pathlib.Path("src"), pathlib.Path("mathcraft_ocr"), pathlib.Path("scripts")]
          violations = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  if "deps" in path.parts:
                      continue
                  text = path.read_text(encoding="utf-8")
                  for token in tokenize.generate_tokens(io.StringIO(text).readline):
                      if token.type == tokenize.COMMENT and any(ord(ch) > 127 for ch in token.string):
                          violations.append(f"{path}:{token.start[0]} non-ASCII comment")
                  try:
                      tree = ast.parse(text)
                  except SyntaxError:
                      continue
                  for node in ast.walk(tree):
                      if not isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                          continue
                      if not node.body:
                          continue
                      first = node.body[0]
                      if (
                          isinstance(first, ast.Expr)
                          and isinstance(first.value, ast.Constant)
                          and isinstance(first.value.value, str)
                          and any(ord(ch) > 127 for ch in first.value.value)
                      ):
                          violations.append(f"{path}:{first.lineno} non-ASCII docstring")
          if violations:
              raise SystemExit("\n".join(violations))
          '@ | python -

      - name: Build Office plugin managed projects
        shell: pwsh
        run: dotnet build office_plugin\LaTeXSnipper.OfficePlugin.slnx -c Release

  platform-validation:
    name: Desktop integration (${{ matrix.runner }})
    if: github.event_name == 'workflow_dispatch' && inputs.platform_validation != 'none'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON('{"windows":["windows-2025"],"linux":["ubuntu-22.04"],"macos":["macos-15"],"all":["windows-2025","ubuntu-22.04","macos-15"]}')[inputs.platform_validation] }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      LATEXSNIPPER_PLATFORM_VALIDATION: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        uses: ./.github/actions/desktop-system-libraries
      - name: Install GUI and test dependencies
        run: python -m pip install -r requirements.txt "pytest>=8,<10"
      - name: Validate X11 and portal protocol handling
        if: runner.os == 'Linux'
        env:
          XDG_SESSION_TYPE: x11
          QT_QPA_PLATFORM: xcb
        run: dbus-run-session -- xvfb-run -a python -X utf8 -m pytest -q -rs test/test_platform_integration.py test/test_qhotkey_linux.py test/test_qhotkey_macos.py
      - name: Validate native platform integration
        if: runner.os != 'Linux'
        run: python -X utf8 -m pytest -q -rs test/test_platform_integration.py test/test_qhotkey_linux.py test/test_qhotkey_macos.py
