name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, name: Compile Check}
          - {runner: ubuntu-22.04, name: Desktop checks (Linux)}
          - {runner: macos-15, name: Desktop checks (macOS)}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        id: python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Byte-compile source tree
        run: python -m compileall -q src mathcraft_ocr

      - name: Validate UTF-8 text boundaries
        run: python test/test_source_encoding.py

      - name: Validate desktop distribution inputs
        run: python scripts/release/desktop_distribution.py sources

      - name: Validate translation catalog
        run: python scripts/translations/update_translations.py --check

      - name: Validate UI translation calls
        run: python scripts/translations/check_ui_translations.py

      - name: Validate Python comment language
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import ast
          import io
          import pathlib
          import tokenize

          roots = [pathlib.Path("src"), pathlib.Path("mathcraft_ocr"), pathlib.Path("scripts")]
          violations = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  if "deps" in path.parts:
                      continue
                  text = path.read_text(encoding="utf-8")
                  for token in tokenize.generate_tokens(io.StringIO(text).readline):
                      if token.type == tokenize.COMMENT and any(ord(ch) > 127 for ch in token.string):
                          violations.append(f"{path}:{token.start[0]} non-ASCII comment")
                  try:
                      tree = ast.parse(text)
                  except SyntaxError:
                      continue
                  for node in ast.walk(tree):
                      if not isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                          continue
                      if not node.body:
                          continue
                      first = node.body[0]
                      if (
                          isinstance(first, ast.Expr)
                          and isinstance(first.value, ast.Constant)
                          and isinstance(first.value.value, str)
                          and any(ord(ch) > 127 for ch in first.value.value)
                      ):
                          violations.append(f"{path}:{first.lineno} non-ASCII docstring")
          if violations:
              raise SystemExit("\n".join(violations))
          '@ | python -

      - uses: ./.github/actions/desktop-system-libraries
        if: runner.os == 'Linux'

      - name: Install Python checkers
        if: runner.os == 'Windows'
        run: python -m pip install "ruff>=0.15,<0.16" "pyright>=1.1.411,<2"

      - name: Validate Python style
        if: runner.os == 'Windows'
        run: python -X utf8 -m ruff check .

      - name: Validate Python formatting
        if: runner.os == 'Windows'
        run: python -X utf8 -m ruff format --check .

      - name: Install desktop test dependencies
        run: python -m pip install -r requirements.txt ".[cpu]" pytest

      - name: Check Python types
        if: runner.os == 'Windows'
        run: python -X utf8 -m pyright --pythonpath "${{ steps.python.outputs.python-path }}"

      - name: Test desktop code
        run: python -X utf8 -m pytest -q -ra

      - name: Test native macOS screenshot panel
        if: runner.os == 'macOS'
        env:
          QT_QPA_PLATFORM: cocoa
        run: >-
          python -X utf8 -m pytest -q -ra
          test/test_macos_background_capture.py::test_nonactivating_panel_stays_on_screen_while_app_is_inactive
