name: Desktop Linux system libraries
description: Install the declared Qt and packaging baseline on a Linux runner
runs:
  using: composite
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends dpkg-dev xvfb libgl1 libglib2.0-0 libx11-6 libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon0 libxkbcommon-x11-0 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxrender1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libnss3 libnspr4 libasound2 libpulse0 libxss1 libxtst6 libgtk-3-0 libgdk-pixbuf-2.0-0 libatk-bridge2.0-0 libcups2 libdrm2 zlib1g policykit-1
