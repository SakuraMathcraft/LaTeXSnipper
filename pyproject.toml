[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathcraft-ocr"
version = "0.3.2"
description = "ONNX-only OCR runtime for mathematical documents"
readme = "README_MATHCRAFT_OCR.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
  { name = "SakuraMathcraft" }
]
keywords = [
  "ocr",
  "latex",
  "math",
  "onnx",
  "document-ocr",
  "formula-recognition"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing"
]
dependencies = [
  "numpy>=2,<3",
  "pillow>=12,<13",
  "opencv-python>=4.10,<5",
  "rapidocr==3.5.0",
  "transformers==4.55.4",
  "tokenizers==0.21.4",
  "protobuf>=4.25,<5",
]

[project.optional-dependencies]
cpu = [
  "onnxruntime>=1.20,<1.30",
]
gpu = [
  "onnxruntime-gpu>=1.27,<1.30",
]
gpu-cu12 = [
  "onnxruntime-gpu>=1.21,<1.27",
]
directml = [
  "onnxruntime-directml>=1.20,<1.30; platform_system == 'Windows'",
]
openvino = [
  "onnxruntime-openvino>=1.20,<1.30; platform_system == 'Windows' or platform_system == 'Linux'",
]
dev = [
  "ruff>=0.15,<0.16",
  "pyright>=1.1.411,<2",
  "build>=1.2",
  "twine>=5.0",
]
pandoc = [
  "pypandoc>=1.15",
]
security = [
  "bandit[toml]>=1.9,<2",
]

[project.urls]
Homepage = "https://github.com/SakuraMathcraft/LaTeXSnipper"
Models = "https://github.com/SakuraMathcraft/MathCraft-Models"
Issues = "https://github.com/SakuraMathcraft/LaTeXSnipper/issues"

[project.scripts]
mathcraft = "mathcraft_ocr.cli:main"
mathcraft-ocr = "mathcraft_ocr.cli:main"

[tool.setuptools.packages.find]
include = ["mathcraft_ocr*"]
exclude = ["src*", "test*", "scripts*", "docs*", "release_assets*", "build*", "dist*"]

[tool.setuptools.package-data]
mathcraft_ocr = ["manifests/*.json", "vendor/LICENSE.onnx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["test"]
addopts = ["--ignore=.venv", "--ignore=build", "--ignore=dist"]

[tool.ruff]
target-version = "py310"
line-length = 88
src = [".", "src", "scripts", "test"]
extend-exclude = ["tools/deps", "**/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.bandit]
exclude_dirs = ["build", "dist", "test", "tools/deps", ".venv"]

[tool.vulture]
paths = ["src"]
exclude = ["build/", "dist/", ".venv/"]
min_confidence = 70
sort_by_size = true
